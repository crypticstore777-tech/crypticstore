name: Sync Printful Products

on:
  # Schedule paused until the sync has been reviewed and a manual dry run looks right.
  # Scheduled runs stay in dry-run mode unless the repo variable
  # PRINTFUL_SYNC_DRY_RUN is set to 'false' (Settings > Secrets and variables > Actions > Variables).
  # schedule:
  #   # Run every 6 hours
  #   - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      dry_run:
        description: "Dry run: read Printful/Shopify and log the plan, write nothing"
        type: choice
        options: ['true', 'false']
        default: 'true'
      limit:
        description: "Only process the first N Printful products (blank = all)"
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Printful sync
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.PRINTFUL_SYNC_DRY_RUN || 'true' }}
          SYNC_LIMIT: ${{ inputs.limit }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          VITE_PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
          VITE_SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          VITE_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run sync

      - name: Notify on success
        if: success()
        run: echo "✓ Printful sync completed successfully"

      - name: Notify on failure
        if: failure()
        run: echo "✗ Printful sync failed" && exit 1
